<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlainTab</title>
    <meta name="darkreader-lock" content="light">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/icon16.png">
    <link rel="stylesheet" href="css/newtab.css">
</head>
<body>

    <!-- 双层壁纸：back 始终可见保证无闪烁，front 用于淡入过渡 -->
    <div class="wallpaper-layer" id="wallpaperBack"></div>
    <script src="js/preload.js"></script>
    <div class="wallpaper-layer wallpaper-layer-front" id="wallpaperFront"></div>

    <!-- 内置轻量书签栏容器 -->
    <div class="bookmarks-bar-wrapper" id="bookmarksBarWrapper">
        <div class="bookmarks-bar" id="bookmarksBar"></div>
    </div>

    <div class="search-bar" id="searchBar">
        <input type="text" id="searchInput" autocomplete="off" autofocus>
        <div class="search-engine-icon" id="searchEngineIcon" title="Switch engine | Enter to search"></div>
    </div>

    <button class="corner-btn settings-btn" id="settingsBtn" title="Wallpaper Settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>

    <div class="settings-panel" id="settingsPanel">
        <h3>Wallpaper</h3>
        <p class="wp-info" id="wpInfo"></p>
        <div id="wallpaperBtns" style="display: flex; gap: 8px; margin-bottom: 8px;">
            <button class="panel-btn primary" id="uploadBtn" style="flex: 1;">Local image</button>
            <button class="panel-btn primary" id="urlBtn" style="flex: 1;">URL image</button>
        </div>
        <button class="panel-btn" id="resetBtn">Reset to Bing daily</button>
        <div class="adv-row">
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
            <button class="panel-btn adv-toggle" id="advToggle">Advanced</button>
            <a class="gh-link" href="https://github.com/kaininx/PlainTab" target="_blank" rel="noopener" title="GitHub">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            </a>
        </div>
        <div class="adv-section" id="advSection">
            <div class="setting-row">
                <label>Search bar</label>
                <select id="searchModeSel">
                    <option value="hover" selected>On hover</option>
                    <option value="always">Always</option>
                    <option value="never">Hidden</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Icon opacity</label>
                <div class="opacity-row">
                    <input type="range" id="opacityRange" min="0" max="1" step="0.01" value="0.45">
                    <input type="number" id="opacityNum" min="0" max="1" step="0.01" value="0.45">
                </div>
            </div>
            <div class="setting-row">
                <label>Search engine</label>
                <select id="engineSel">
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                </select>
            </div>
            <div class="setting-row">
                <label>Bookmarks opacity</label>
                <div class="opacity-row">
                    <input type="range" id="bmOpacityRange" min="0" max="1" step="0.01" value="0.35">
                    <input type="number" id="bmOpacityNum" min="0" max="1" step="0.01" value="0.35">
                </div>
            </div>
            <button class="panel-btn" id="resetAdvBtn">Reset defaults</button>
        </div>
    </div>

    <script src="js/languages.js"></script>
    <script src="js/newtab.js"></script>
</body>
</html>
